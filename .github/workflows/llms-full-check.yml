name: Check llms-full.txt

on:
  pull_request:
    paths:
      - 'README.md'
      - 'PATTERNS.md'
      - 'META_ARCHITECTURE.md'
      - 'ADOPTION.md'
      - 'WORKFLOW.md'
      - 'docs/llms-full.txt'
      - 'scripts/gen_llms_full.py'
      - '.github/workflows/llms-full-check.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'PATTERNS.md'
      - 'META_ARCHITECTURE.md'
      - 'ADOPTION.md'
      - 'WORKFLOW.md'
      - 'docs/llms-full.txt'
      - 'scripts/gen_llms_full.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # docs/llms-full.txt is generated from the five source documents above.
      # Editing a source without regenerating publishes a stale full-text
      # reference to the Pages site, which is what this gate catches.
      - name: Check llms-full.txt is current
        run: python scripts/gen_llms_full.py --check
