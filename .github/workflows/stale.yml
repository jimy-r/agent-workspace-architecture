name: Stale Dependabot PRs

on:
  schedule:
    - cron: '17 6 * * *'  # daily at 06:17 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # A person's thread waits for a reply, so issues never go stale and
          # only Dependabot's PRs carry the one label this bot acts on.
          days-before-issue-stale: -1
          days-before-issue-close: -1
          only-pr-labels: 'dependencies'
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          stale-pr-message: >
            This PR has been inactive for 30 days. It will close in 14 days
            unless there is further activity.
          close-pr-message: >
            Closing due to inactivity. Dependabot opens a new PR for any update
            it still wants.
          exempt-pr-labels: 'pinned,blocked,work-in-progress'
          operations-per-run: 100
