name: Validate samples

on:
  pull_request:
    paths:
      - 'samples/**'
      - 'scripts/validate_samples.py'
      - 'tools/workspace_check.py'
      - 'docs/self-score.md'
      - '.github/workflows/validate-samples.yml'
  push:
    branches: [main]
    paths:
      - 'samples/**'
      - 'scripts/validate_samples.py'
      - 'tools/workspace_check.py'
      - 'docs/self-score.md'
      - '.github/workflows/validate-samples.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml==6.0.3

      - name: Run sample validator
        run: python scripts/validate_samples.py

      # scripts/validate_samples.py checks frontmatter keys only. The roles
      # library ships its own validator, whose second phase resolves every
      # sample binding's @-included role against the files in samples/roles/.
      # Nothing in CI ran that phase, so a binding pointing at a role no
      # sample defines shipped undetected (audit finding df392230).
      - name: Run roles library validator
        run: python samples/roles/_validate.py

      # The sample hooks are code people copy, so they are run here as well as
      # read. The step runs from a directory other than the project root, as a
      # hook does once the agent has changed directory. Each payload goes to
      # the hooks whose matcher names its tool, the way Claude Code routes it,
      # so a tool that no matcher covers (PowerShell, say) fails here. A hook
      # that cannot start exits non-zero but not 2, and Claude Code lets that
      # tool call through, so every bad payload must come back as exactly 2.
      - name: Run each sample hook as settings.example.json wires it
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}/samples
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python3 - "$CLAUDE_PROJECT_DIR/.claude/settings.example.json" <<'EOF'
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile

          root = os.environ["CLAUDE_PROJECT_DIR"]
          with open(sys.argv[1], encoding="utf-8") as fh:
              settings = json.load(fh)

          # A bare `git push` sends the current branch, which the guard reads
          # from git. One scratch repo sits on main and one on a feature branch.
          repo = {}
          for branch in ("main", "feature"):
              repo[branch] = tempfile.mkdtemp()
              subprocess.run(["git", "init", "-q", "-b", branch, repo[branch]], check=True)

          def shell(command, tool="Bash"):
              return {"tool_name": tool, "tool_input": {"command": command}}

          cases = {
              2: [
                  {"tool_name": "Write", "tool_input": {"file_path": ".env"}},
                  shell("echo KEY=1 > .env"),
                  shell("git push --force origin feature"),
                  shell("rm -f old.log .env"),
                  shell("mv .env backup.txt"),
                  shell(f'git -C "{repo["main"]}" push'),
                  shell("git push origin HEAD:main"),
                  shell("git push origin +main"),
                  shell("git push origin refs/heads/main"),
                  shell("git push origin feature:main"),
                  shell("git -C some/dir push origin main"),
                  shell("Remove-Item -Path .env -Force", "PowerShell"),
                  # The command behind a shell keyword, inside braces, on a
                  # continued line, or aimed at a quoted path with a space in it.
                  shell("if [ -f .env ]; then rm .env; fi"),
                  shell('for f in a b; do rm -f "$f" .env; done'),
                  shell("if (Test-Path .env) { Remove-Item .env }", "PowerShell"),
                  shell("if true; then git push --force origin feature; fi"),
                  shell("rm -f \\\n  .env"),
                  shell("Remove-Item `\n  -Path .env", "PowerShell"),
                  shell('echo KEY=1 > "my secrets/out.txt"'),
                  # Commands outside quotes that a comment or a stray mark must not
                  # hide. They stand under a comment line, under a line that ends in
                  # a note, under a line with a hash sign inside a word and under a
                  # line with an escaped quote. The last one has a note after it that
                  # names a softer flag. The guard's docstring lists the shapes in
                  # which a comment or a stray quote mark does hide a command. The
                  # cases are pushes, a cmdlet and a second operand, because the rm
                  # and mv text patterns would catch a plain delete here whatever
                  # the parser read.
                  shell("# ship it\ngit push origin main"),
                  shell("git status  # check first\ngit push --force origin feature"),
                  shell("echo build#12\ngit push -f origin feature"),
                  shell('echo "5\\" disk"\ngit push origin master'),
                  shell("# tidy up\nrm -f old.log .env"),
                  shell("# remove the old file\nRemove-Item .env", "PowerShell"),
                  shell("git rm old.log .env  # --cached"),
                  # The same under a here-document with an apostrophe in it. The shell
                  # reads that mark as plain text and the lexer reads it as a quote, so
                  # a plain split takes over. It still sees a command outside quotes.
                  shell("cat <<'NOTE' > notes.md\nit's a note\nNOTE\ngit push origin main"),
                  # A quote mark inside a comment. One in a note leaves the quotes
                  # unbalanced, so a command inside quotes or behind a quoted value
                  # goes unread unless the note is cut off first.
                  shell('bash -c "git push --force origin feature"\n# it\'s fine'),
                  shell('bash -c "git push origin main"  # don\'t wait'),
                  shell('pwsh -Command "Remove-Item .env"  # don\'t keep', "PowerShell"),
                  shell('powershell -Command "Remove-Item .env"\n# that\'s all', "PowerShell"),
                  shell('git -C "my repo" push origin main  # don\'t wait'),
                  shell('git -c "user.name=A B" push origin main  # don\'t'),
                  shell('pwsh -Command \'Remove-Item .env\'  # 5" disk', "PowerShell"),
                  # One in a comment above the command and one below pair with the
                  # command's own quotes and pull its operands apart.
                  shell("# don't keep the old copy\nrm 'old copy.txt' .env\n# that's all"),
                  shell("# it's fine\nrm 'my file' .env  # don't worry"),
                  shell('# say "hello\ncp "my file" .env\n# end "quote'),
                  shell("# don't\nmv 'a b.txt' .env\n# it's ok"),
                  shell("# don't lose it\nCopy-Item 'my notes.txt' .env\n# that's the config", "PowerShell"),
                  shell("ls  # don't\nrm 'a b' .env\nls # it's"),
                  shell("# don't keep these\nRemove-Item 'old copy.txt' .env\n# that's all", "PowerShell"),
                  # Where a comment starts and ends is the shell's call. A hash sign
                  # inside quotes earlier on the line is not one. A backslash at the
                  # end of a comment continues nothing. A comment can start straight
                  # after a `;` or a `<`, and PowerShell ends one at a lone carriage
                  # return.
                  shell('git commit -m "fix #12" && bash -c "rm .env"  # don\'t worry'),
                  shell('echo a # note \\\nrm -f \\\n  .env'),
                  shell('bash -c "rm .env";# don\'t'),
                  shell('pwsh -Command "Remove-Item .env" <# don\'t #>', "PowerShell"),
                  shell('# note\rRemove-Item .env', "PowerShell"),
                  # A line further down that leaves a quote open sends every line to
                  # a split that does not follow quotes, and Bash has run the lines
                  # above it by then. The text in front of the first comment is read
                  # alone, so it stays out of reach. A quoted script has its comments
                  # cut out as well.
                  shell('bash -c "rm .env"  # note\necho it\'s done'),
                  shell('bash -c "rm .env"\n# note\necho it\'s done'),
                  shell('FOO="a b" rm .env  # note\necho "unfinished'),
                  shell('bash -c "git push origin main"  # note\necho it\'s'),
                  shell('bash -c "FOO=\'a b\' rm .env  # don\'t"'),
                  # The same shapes as pushes and a cmdlet. The rm text pattern
                  # catches the deletes above whatever the parser reads, so these
                  # are the ones that fail here if the cut is lost.
                  shell('echo "a # b"; bash -c "git push origin main"  # don\'t'),
                  shell('pwsh -Command "Remove-Item .env";# don\'t', "PowerShell"),
                  shell('bash -c "git push --force origin feature"  # note\necho it\'s done'),
                  shell('bash -c "git push origin main"\n# note\necho it\'s done'),
                  shell('FOO="a b" git push origin main  # note\necho "unfinished'),
                  shell('bash -c "FOO=\'a b\' git push origin main  # don\'t"'),
                  shell('# note\rgit push origin main', "PowerShell"),
                  # The sample's own rules: an exec-hijacking variable set in
                  # front of a command, and a delete behind a prefix that only
                  # the text patterns read.
                  shell("GIT_SSH_COMMAND='ssh -i other' git fetch"),
                  shell("timeout 5 rm .env"),
                  # A push behind a prefix the parser has no rule for. Only the
                  # push text patterns read these, so they fail here if those
                  # patterns are dropped from the guard's git table again.
                  shell("timeout 5 git push --force origin feature"),
                  shell("eval git push --force origin feature"),
                  shell("sudo -u root git push --force origin feature"),
                  shell("nice -n 5 git push --force origin feature"),
                  shell("watch git push --force origin feature"),
                  shell("doas git push --force origin feature"),
                  shell("busybox git push --force origin feature"),
                  shell("timeout 5 git push origin main"),
                  shell("eval git push origin main"),
                  shell("timeout 60 git push -f origin feature"),
                  shell("timeout 60 git push --force-with-lease origin feature"),
                  # A quoted force push beside a stray quote mark: a later line
                  # that leaves a quote open, an apostrophe in a here-document
                  # above, and a quote behind a backslash above. The lexer gives
                  # up on each and the plain split does not look inside quotes.
                  shell('bash -c "git push --force origin feature"\necho it\'s done'),
                  shell('cat <<EOF\ndon\'t\nEOF\nbash -c "git push --force origin feature"'),
                  shell('echo 5\\" disk\nbash -c "git push --force origin feature"'),
                  # The patterns stop at the end of a statement, so a push to main
                  # or a force push behind a prefix must still be found when a
                  # harmless statement stands in front of it or behind it.
                  shell("git push origin feature && timeout 5 git push origin main"),
                  shell("echo ok\ntimeout 5 git push --force origin feature"),
                  shell("git status; eval git push origin main; git status"),
                  shell("timeout 5 git push origin main:main"),
              ],
              0: [
                  {"tool_name": "Write", "tool_input": {"file_path": "docs/notes.md"}},
                  shell("ls -la docs"),
                  shell("rm -f old.log build.log"),
                  shell(f'git -C "{repo["feature"]}" push'),
                  shell("git push origin main:feature"),
                  # A feature push with a later statement that names main. The
                  # push text patterns end with the statement, so these pass.
                  shell("git push origin feature && git checkout main"),
                  shell("git push -u origin feature\ngh pr create --base main --fill"),
                  shell("git push origin feature; git log main"),
                  shell("git push origin main-fixes"),
                  shell("Get-ChildItem docs", "PowerShell"),
                  # The same shapes around files that are not protected. The
                  # last PowerShell one is two statements: a path that ends in
                  # a backslash does not continue onto the line below it.
                  shell("if [ -f notes.md ]; then rm old.log; fi"),
                  shell("if (Test-Path old.log) { Remove-Item old.log }", "PowerShell"),
                  shell("rm -f \\\n  old.log"),
                  shell('echo done > "my notes/out.txt"'),
                  shell("Remove-Item C:\\temp\\\nGet-Content secrets-policy.md", "PowerShell"),
                  # Ordinary commands that hold a hash sign, and a harmless push
                  # under a comment line and after a trailing comment.
                  shell("# list the docs\nls -la docs"),
                  shell("rm -f old.log  # tidy up"),
                  shell("curl -s https://example.com/page#top"),
                  shell('echo "issue #12 is fixed"'),
                  shell('git commit -m "fix #12: tidy the notes"'),
                  shell("# list the docs\nGet-ChildItem docs", "PowerShell"),
                  shell("# ship it\ngit push origin feature"),
                  shell("git status  # check first\ngit push origin feature"),
                  # Harmless commands with a quote mark in a comment, an index-only
                  # `git rm` with a hash sign inside a quoted name, and a Bash comment
                  # that a lone carriage return does not end.
                  shell("ls -la docs  # don't forget the notes"),
                  shell("# don't run this yet\nls 'my docs'\n# that's all"),
                  shell('git rm --cached "x #1" .env'),
                  shell('Write-Host "it\'s done"  # don\'t worry', "PowerShell"),
                  shell('# note\rgit push origin main'),
                  shell("git push origin feature  # CI's turn"),
                  # A harmless command inside the quotes of two of the shapes above,
                  # and a harmless push under a here-document with an apostrophe in it.
                  shell('bash -c "ls docs"  # note\necho it\'s done'),
                  shell('bash -c "git push origin feature"  # don\'t worry'),
                  shell("cat <<'NOTE' > notes.md\nit's a note\nNOTE\ngit push origin feature"),
                  # An ordinary variable, and a copy of a protected name inside
                  # the sample tree the guard's allowlist names.
                  shell("FOO=1 make build"),
                  shell("rm agent-workspace-architecture/samples/.env"),
              ],
          }

          def run(hook, payload):
              argv = [hook["command"]] + [
                  a.replace("${CLAUDE_PROJECT_DIR}", root) for a in hook.get("args", [])
              ]
              try:
                  return subprocess.run(
                      argv, input=json.dumps(payload), text=True,
                      capture_output=True, timeout=hook.get("timeout", 600),
                  ).returncode
              except OSError as exc:
                  return f"could not start ({exc})"

          failures = []
          groups = settings["hooks"]["PreToolUse"]
          for group in groups:
              for hook in group["hooks"]:
                  timeout = hook.get("timeout", 600)
                  if timeout > 60:
                      failures.append(f"{group['matcher']}: timeout {timeout} is seconds, not ms")

          for want, payloads in cases.items():
              for payload in payloads:
                  tool = payload["tool_name"]
                  hooks = [
                      hook for group in groups if re.fullmatch(group["matcher"], tool)
                      for hook in group["hooks"]
                  ]
                  if not hooks:
                      print(f"FAIL: no PreToolUse matcher covers the {tool} tool")
                      failures.append(f"{tool}: no matcher")
                      continue
                  got = [run(hook, payload) for hook in hooks]
                  ok = 2 in got if want == 2 else all(code == 0 for code in got)
                  print(f"{'ok' if ok else 'FAIL'}: {tool} {payload['tool_input']}: exit {got}, want {want}")
                  if not ok:
                      failures.append(f"{tool}: {payload['tool_input']}")

          if failures:
              sys.exit("hook check failed: " + "; ".join(failures))
          EOF

  self-score:
    # The README quotes this repo's own workspace_check score, and docs/self-score.md
    # carries the full run with its commit and date (audit finding 9e33f455: the most
    # quoted number in the repo had no provenance). Derive it, never hand-maintain it.
    # Only the "Score N/10 ..." line is compared, so re-wording a check's evidence text
    # does not fail the build; a change in the score does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Recorded self-score still matches a fresh run
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys
          from pathlib import Path

          SCORE_RE = re.compile(r"(?m)^Score \d+(?:\.\d+)?/10\b.*$")

          recorded = SCORE_RE.findall(
              Path("docs/self-score.md").read_text(encoding="utf-8"))
          if not recorded:
              sys.exit("docs/self-score.md has no 'Score N/10 ...' line - format changed?")
          if len(set(recorded)) > 1:
              sys.exit("docs/self-score.md records more than one distinct score line:\n  "
                       + "\n  ".join(sorted(set(recorded))))

          run = subprocess.run([sys.executable, "tools/workspace_check.py", "."],
                               capture_output=True, text=True, encoding="utf-8")
          fresh = SCORE_RE.findall(run.stdout)
          if not fresh:
              sys.exit("workspace_check.py printed no 'Score N/10 ...' line.\n"
                       f"exit={run.returncode}\nstdout:\n{run.stdout}\nstderr:\n{run.stderr}")

          if fresh[0] != recorded[0]:
              sys.exit("The recorded self-score is stale.\n"
                       f"  docs/self-score.md: {recorded[0]}\n"
                       f"  fresh run:          {fresh[0]}\n"
                       "Re-run 'python tools/workspace_check.py .' and update "
                       "docs/self-score.md (full table, commit sha, date) and the "
                       "README block that quotes it.")
          print(f"OK: docs/self-score.md matches a fresh run - {fresh[0]}")
          EOF
